permalink: none
exclude: [ "sass", "CNAME", "config.rb", "LICENSE", "README.md", "_assets", "Gemfile", "Gemfile.lock", "rakefile" ]


prose:
 rooturl: "_posts/"
 metadata: 
  "_posts/exhibits": |
   layout: default
   category: exhibit
   title: "El titulo del exhibit"
   section: "La sección a la que pertenece este exhibit"
  "_posts/sections": |
   layout: default
   category: section
   title: "El título de la sección"



title: sonomayrit
author: sonomayrit


picture:
  source: "src/Images"
  output: "src/Images/generated"
  suppress_warnings: true
  disabled: false
  
  presets:
    jpt-webp:
      media_queries:
        default:
          width: [400, 800, 1200, 1600]
          format: webp
          quality: 10
        fallback:
          width: [400, 800, 1200, 1600]
          format: jpg
          quality: 85
  