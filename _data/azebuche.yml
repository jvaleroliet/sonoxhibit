intro: >-
  A sonic archive of olive harvest songs, voices and field recordings
  from across the Mediterranean.

about: >-
  “Olive Harvest Songbook” is a sonic-archival project exploring the connections between the olive harvest season across the Mediterranean. This project explores the songs, flavours and rituals that accompany the tradition of harvesting olives.
  For centuries, the olive harvest season, a time of communal labor and celebration, has been accompanied by rituals, songs and traditions that reflect the connection between people and the land. As such, the olive tree transcends its botanical identity and serves as a symbol of intergenerational and interregional connectivity, cultural resistance and ecological sustainability.
  Given its multidimensional values and powerful role within its communities, “Olive Harvest Songbook” aspire to present an immersive, creative and well-rounded perspective on the ways olive trees are so embedded into the social imaginary across the Mediterranean, specially focusing on the songs, soundscapes, rituals, cuisines, political threats and cultural legacy around their harvest season.


contribute: >-
  Do you have a harvest song, a recording, a recipe, or a memory of the harvest?
  Contribute to the archive.

